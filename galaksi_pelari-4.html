<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🌌 GALAKSI PELARI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#050720 0%,#1a1040 50%,#2e1065 100%);overflow:hidden;font-family:Arial,sans-serif;touch-action:none}
#game{width:100vw;height:100vh;position:relative;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
#ship{position:absolute;bottom:18%;left:50%;width:50px;height:60px;transform:translateX(-50%);z-index:10;transition:left .08s ease-out;filter:drop-shadow(0 0 15px #00ffff) drop-shadow(0 0 25px #ff00ff)}
#shipLabel{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);color:#fff;font-size:18px;font-weight:bold;letter-spacing:1px;text-shadow:0 0 6px #00ffff,0 0 12px #ff00ff,0 2px 4px #000;white-space:nowrap;z-index:12}
#shipBody{width:100%;height:100%;background:linear-gradient(180deg,#00ffff,#0080ff);clip-path:polygon(50% 0%,100% 70%,80% 100%,20% 100%,0% 70%);border-radius:50% 50% 10% 10%}
.shipWing{position:absolute;bottom:5px;width:20px;height:25px;background:linear-gradient(180deg,#ff00ff,#8000ff);clip-path:polygon(0 0,100% 100%,0 100%)}
#wingL{left:-10px;transform:rotate(-15deg)}#wingR{right:-10px;transform:rotate(15deg)}
#shipFire{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);width:20px;height:25px;background:linear-gradient(180deg,#ffff00,#ff8800,#ff0000);border-radius:0 0 50% 50%;animation:fire .15s ease-in-out infinite alternate;filter:blur(3px)}
@keyframes fire{0%{height:20px;opacity:.9}100%{height:30px;opacity:1}}
.obstacle{position:absolute;top:-60px;border-radius:8px;z-index:5;animation:glow 1.5s ease-in-out infinite alternate}
@keyframes glow{0%{filter:drop-shadow(0 0 8px currentColor)}100%{filter:drop-shadow(0 0 20px currentColor)}}
.asteroid{background:linear-gradient(135deg,#777,#444);border-radius:50%}
.laser{background:linear-gradient(90deg,#ff0055,#ff5500);height:8px!important;border-radius:4px}
.coin{position:absolute;top:-40px;width:30px;height:30px;background:radial-gradient(circle at 30% 30%,#fff740,#ffc800);border-radius:50%;box-shadow:0 0 15px #ffd000,inset 0 0 10px #fff;z-index:6;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
#hud{position:absolute;top:15px;left:0;right:0;padding:0 20px;display:flex;justify-content:space-between;align-items:center;z-index:20;color:#fff;font-weight:bold;text-shadow:0 0 10px #000;font-size:20px}
.scoreVal{color:#ffff00}.coinVal{color:#ffd000}.lifeVal{color:#ff4444}
#musicBtn{background:rgba(0,0,0,.5);border:2px solid #fff;border-radius:50%;width:40px;height:40px;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:30;color:#fff;text-align:center;padding:20px}
#gameOver{display:none}
h1{font-size:42px;background:linear-gradient(90deg,#00ffff,#ff00ff,#ffff00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:15px}
.subtitle{font-size:18px;color:#a0a0ff;margin-bottom:30px;max-width:300px;line-height:1.5}
.btn{padding:15px 50px;font-size:24px;font-weight:bold;color:#fff;background:linear-gradient(90deg,#00ccff,#9933ff);border:0;border-radius:50px;cursor:pointer;box-shadow:0 0 20px rgba(0,204,255,.5);margin:8px}
.btn:active{transform:scale(.95)}
.finalScore{font-size:36px;color:#ffff00;margin:20px 0}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 30px;z-index:25;pointer-events:none}
.ctrl{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.15);border:3px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;pointer-events:auto;user-select:none}
.hidden{display:none!important}
@media(max-width:480px){h1{font-size:34px}.btn{padding:14px 30px;font-size:20px}}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div>🏆 <span class="scoreVal" id="score">0</span></div>
    <div>💰 <span class="coinVal" id="coins">0</span></div>
    <div>❤️ <span class="lifeVal" id="lives">3</span></div>
    <button id="musicBtn">🔇</button>
  </div>

  <div id="ship" class="hidden">
    <div id="shipLabel">YOU</div>
    <div id="shipBody"></div>
    <div id="wingL" class="shipWing"></div>
    <div id="wingR" class="shipWing"></div>
    <div id="shipFire"></div>
  </div>

  <div id="startScreen" class="screen">
    <h1>🚀 GALAKSI PELARI</h1>
    <p class="subtitle">Terbang melintasi galaksi! Hindari asteroid & laser, kumpulkan koin emas, dan raih skor tertinggi! 🌟</p>
    <button class="btn" id="startBtn">MULAI TERBANG!</button>
    <p style="margin-top:20px;color:#888;font-size:14px">⬅️➡️ Geser / tombol panah untuk bergerak</p>
  </div>

  <div id="gameOver" class="screen">
    <h1>💥 KABUM!</h1>
    <p class="subtitle">Pesawatmu hancur di tengah galaksi...</p>
    <div class="finalScore">Skor: <span id="finalScore">0</span></div>
    <p>💰 Koin: <span id="finalCoins">0</span></p>
    <button class="btn" id="restartBtn">TERBANG LAGI!</button>
  </div>

  <div id="controls" class="hidden">
    <div class="ctrl" id="ctrlLeft">⬅️</div>
    <div class="ctrl" id="ctrlRight">➡️</div>
  </div>
</div>

<script>
const AudioContextClass=window.AudioContext||window.webkitAudioContext;
let audioCtx=null,musicPlaying=false,musicInterval=null,musicOscillators=[];
function initAudio(){if(!audioCtx)audioCtx=new AudioContextClass();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(freq,dur,type='sine',vol=.15,endFreq=null){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);o.type=type;
  o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,audioCtx.currentTime+dur);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.start();o.stop(audioCtx.currentTime+dur);
}
function playCoinSound(){if(musicPlaying)tone(880,.15,'sine',.3,1760)}
function playHitSound(){if(musicPlaying)tone(220,.3,'sawtooth',.4,55)}
function playStartSound(){[330,660,990].forEach((f,i)=>setTimeout(()=>tone(f,.2,'sine',.25),i*150))}
function playGameOverSound(){[440,349,294,220].forEach((f,i)=>setTimeout(()=>tone(f,.4,'triangle',.3),i*250))}
const melody=[392,440,494,523,494,440,392,330,392,440,330,392];let noteIndex=0;
function playBackgroundMusic(){if(!audioCtx||!musicPlaying)return;const n=melody[noteIndex++%melody.length];tone(n,.18,'square',.08);}

const game=document.getElementById('game');
for(let i=0;i<80;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';const z=Math.random()*3+1;s.style.width=z+'px';s.style.height=z+'px';s.style.animationDelay=Math.random()*2+'s';game.appendChild(s)}

const ship=document.getElementById('ship'),startScreen=document.getElementById('startScreen'),gameOverScreen=document.getElementById('gameOver'),controls=document.getElementById('controls');
const scoreEl=document.getElementById('score'),coinsEl=document.getElementById('coins'),livesEl=document.getElementById('lives'),musicBtn=document.getElementById('musicBtn');
let gameRunning=false,score=0,coins=0,lives=3,shipX=50,speed=5,obstacles=[],coinsArr=[],gameLoop=null,spawnTimer=null,difficultyTimer=null;
function setShipPos(){ship.style.left=shipX+'%'}
function updateHUD(){scoreEl.textContent=score;coinsEl.textContent=coins;livesEl.textContent=lives}

function startMusic(){initAudio();if(!musicPlaying){musicPlaying=true;musicBtn.textContent='🔊';playStartSound();musicInterval=setInterval(playBackgroundMusic,200)}}
function stopMusic(){clearInterval(musicInterval);musicInterval=null;musicPlaying=false;musicBtn.textContent='🔇'}
musicBtn.onclick=()=>{initAudio();musicPlaying?stopMusic():startMusic()};

document.getElementById('startBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=startGame;

function startGame(){
  startMusic();score=0;coins=0;lives=3;shipX=50;speed=5;
  clearInterval(gameLoop);clearInterval(spawnTimer);clearInterval(difficultyTimer);
  obstacles.forEach(o=>o.el.remove());coinsArr.forEach(c=>c.el.remove());obstacles=[];coinsArr=[];
  updateHUD();setShipPos();startScreen.classList.add('hidden');gameOverScreen.style.display='none';ship.classList.remove('hidden');controls.classList.remove('hidden');gameRunning=true;
  gameLoop=setInterval(update,16);spawnTimer=setInterval(spawnThing,900);difficultyTimer=setInterval(()=>{if(speed<12)speed+=.3},4000);
}
document.addEventListener('keydown',e=>{if(!gameRunning)return;if(e.key==='ArrowLeft')shipX=Math.max(8,shipX-5);if(e.key==='ArrowRight')shipX=Math.min(92,shipX+5);setShipPos()});
let touchStartX=null;
game.addEventListener('touchstart',e=>{if(gameRunning)touchStartX=e.touches[0].clientX},{passive:true});
game.addEventListener('touchmove',e=>{if(!gameRunning||touchStartX===null)return;e.preventDefault();const dx=e.touches[0].clientX-touchStartX;if(Math.abs(dx)>8){shipX=Math.max(8,Math.min(92,shipX+(dx>0?4:-4)));setShipPos();touchStartX=e.touches[0].clientX}},{passive:false});
game.addEventListener('touchend',()=>touchStartX=null);
let controlInterval=null;
function bindControl(id,dir){
  const el=document.getElementById(id);
  const stop=()=>{clearInterval(controlInterval);controlInterval=null;};
  const move=()=>{if(!gameRunning){stop();return}shipX=Math.max(8,Math.min(92,shipX+dir*1.5));setShipPos()};
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(!gameRunning)return;
    stop();
    move();
    controlInterval=setInterval(move,30);
    try{el.setPointerCapture(e.pointerId)}catch(err){}
  });
  el.addEventListener('pointerup',stop);
  el.addEventListener('pointercancel',stop);
  el.addEventListener('pointerleave',e=>{if(e.buttons===0)stop()});
}
bindControl('ctrlLeft',-1);bindControl('ctrlRight',1);

function spawnThing(){if(!gameRunning)return;const r=Math.random();if(r<.55)spawnAsteroid();else if(r<.8)spawnLaser();else spawnCoin()}
function spawnAsteroid(){const el=document.createElement('div'),w=35+Math.random()*35;el.className='obstacle asteroid';el.style.width=w+'px';el.style.height=w+'px';el.style.left=(Math.random()*85+5)+'%';el.style.color='#888';game.appendChild(el);obstacles.push({el,y:-60,w,h:w})}
function spawnLaser(){const el=document.createElement('div'),w=60+Math.random()*100;el.className='obstacle laser';el.style.width=w+'px';el.style.left=(Math.random()*80+5)+'%';el.style.color='#ff2255';game.appendChild(el);obstacles.push({el,y:-20,w,h:8})}
function spawnCoin(){const el=document.createElement('div');el.className='coin';el.style.left=(Math.random()*85+5)+'%';game.appendChild(el);coinsArr.push({el,y:-40})}

function overlaps(a,b){return a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top}
function update(){
  if(!gameRunning)return;
  score++;
  const shipRect=ship.getBoundingClientRect(),gameRect=game.getBoundingClientRect();
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];o.y+=speed;o.el.style.top=o.y+'px';
    if(o.y>gameRect.height){o.el.remove();obstacles.splice(i,1);continue}
    const x=parseFloat(o.el.style.left)/100*gameRect.width;
    if(overlaps(shipRect,{left:x,right:x+o.w,top:o.y,bottom:o.y+o.h})){hitObstacle(i)}
  }
  for(let i=coinsArr.length-1;i>=0;i--){
    const c=coinsArr[i];c.y+=speed;c.el.style.top=c.y+'px';
    if(c.y>gameRect.height){c.el.remove();coinsArr.splice(i,1);continue}
    const x=parseFloat(c.el.style.left)/100*gameRect.width;
    if(overlaps(shipRect,{left:x,right:x+30,top:c.y,bottom:c.y+30}))collectCoin(i)
  }
  if(score%10===0)updateHUD()
}
function hitObstacle(i){if(!obstacles[i])return;obstacles[i].el.remove();obstacles.splice(i,1);lives--;playHitSound();updateHUD();ship.style.opacity='.25';setTimeout(()=>ship.style.opacity='1',250);if(lives<=0)gameOver()}
function collectCoin(i){coinsArr[i].el.remove();coinsArr.splice(i,1);coins++;score+=100;playCoinSound();updateHUD()}
function gameOver(){
  gameRunning=false;clearInterval(gameLoop);clearInterval(spawnTimer);clearInterval(difficultyTimer);
  playGameOverSound();stopMusic();obstacles.forEach(o=>o.el.remove());coinsArr.forEach(c=>c.el.remove());obstacles=[];coinsArr=[];
  ship.classList.add('hidden');controls.classList.add('hidden');document.getElementById('finalScore').textContent=score;document.getElementById('finalCoins').textContent=coins;gameOverScreen.style.display='flex'
}
</script>
</body>
</html>
